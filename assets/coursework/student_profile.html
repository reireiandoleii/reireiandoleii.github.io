<!DOCTYPE html>
<html>
<head>
    <title>CSS Seatwork</title>

		<style>
			body { 
				background-color: lightgray;
				font-family: "Roboto";
			}

			    .profile { 
			    background: white;
			    padding: 50px;
			    width: 400px;	
				justify-content: center;
				align-items: center;
				display: flex;
				flex-direction: column;
			    border: 3px solid navy;
			}
			
			h1 { 
			    background: navy;
				color: white;
			    padding: 15px 80px;
				font-family: "Arial";
			    width: 300px;
			}
			
			img{
				max-width: 100px;
				}
			
			h2 { 
				color: navy;
				font-family: "Arial";
			    width: 300px;
				align-items: center;

			.login-form{
				display: flex;
				justify-content: center;
				align-items: center;
				height: 100%;
			    border-color: rgb(0 149 121);
			}

			p{
				margin-top: 0;
			    margin-bottom: 20px;
			    text-align: center;
			    font-size: 24px;
				align-items: center;
			}

			}

			}

			.form-control:hover {
			    box-shadow: 0px 0px 0px 3px #01806857;
			    border-color: rgb(0 149 121);
			}

			a { 
				color: rgb(0 149 121); 
				font-weight:bolder;
				text-decoration: none;
			}
			a:hover{
				color: #333;
			}

			.btn-submit{
				background-color: rgb(0 149 121);
			    display: block;
			    width: 100%;
			    border-radius: 10px;
			    padding: 15px 23px;
			    color: white;
			    border: 0;
			    font-weight: bolder;
			    font-size: 16px;
			    margin: 22px 0;
			}

			.btn-submit:hover{
				background-color: black;
				cursor: pointer;
				transition: 1s ease;
			}

			.footer{
				text-align: center;
				margin-top: 10px;
				display: block;
			    background: gray;
				color: white;
			    padding: 15px 15px;
				font-family: "Arial";
			    width: 300px;
			}
		</style>
</head>

<body>

    <div class="profile">

        <h1>STUDENT PROFILE</h1>

        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/html5/html5-original.svg"
             alt="HTML Logo">

        <h2>Alex Rivera</h2>
        <p class="program">BS Information Technology</p>

        <h3>About Me</h3>

        <p>
            I am an IT student interested in web development,
            programming, and user interface design.
        </p>

        <h3>Current Courses</h3>

        <table>
            <tr>
                <th>Course</th>
                <th>Units</th>
            </tr>
            <tr>
                <td>Web Design</td>
                <td>3</td>
            </tr>
            <tr>
                <td>Programming</td>
                <td>3</td>
            </tr>
            <tr>
                <td>Database Systems</td>
                <td>3</td>
            </tr>
        </table>

        <p class="footer">Learning one line of code at a time.</p>

    </div>

</body>
</html>
